<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>annotate — cellyoulite</title>
<link rel="stylesheet" href="/static/app.css" />
<style>
  body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif;
         background: #111; color: #eee; }
  header { display: flex; gap: 12px; align-items: center;
           padding: 8px 12px; background: #1a1a1a; border-bottom: 1px solid #333;
           position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header select, header button { background: #222; color: #eee;
           border: 1px solid #444; padding: 4px 8px; border-radius: 4px;
           font-size: 13px; }
  header button { cursor: pointer; }
  header button.primary { background: #2a4; border-color: #2a4; }
  header button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: #888; font-size: 12px; }
  .status { margin-left: auto; font-size: 12px; color: #8c8; }
  .status.dirty { color: #ec6; }
  .stage { position: relative; display: inline-block; margin: 12px; }
  #img { display: block; max-width: 100%; }
  #canvas { position: absolute; inset: 0; cursor: crosshair; }
  .legend { padding: 4px 12px; font-size: 12px; color: #aaa; }
  kbd { background: #222; border: 1px solid #444; padding: 1px 5px;
        border-radius: 3px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <strong>annotate</strong>
  <select id="well-sel"></select>
  <select id="tp-sel"></select>
  <label class="hint"><input type="checkbox" id="aligned" checked> aligned</label>
  <select id="copy-from" title="copy circles from another timepoint">
    <option value="">copy from…</option>
  </select>
  <button id="clear">clear all</button>
  <span id="status" class="status">—</span>
</header>
<div class="legend">
  <kbd>click</kbd> empty: set centre → click again: set radius ·
  <kbd>click</kbd> on circle: select ·
  <kbd>←↑↓→</kbd> nudge selected (shift = ×10) ·
  <kbd>shift</kbd>+<kbd>↑↓</kbd> resize selected ·
  <kbd>s</kbd> toggle ⭐ star ·
  <kbd>delete</kbd> remove selected ·
  <kbd>right-click</kbd> circle to delete ·
  <kbd>esc</kbd> deselect / cancel
</div>
<div class="stage">
  <img id="img" src="" alt="" />
  <canvas id="canvas"></canvas>
</div>

<script type="module" src="/static/js/annotate.js?v={{ version }}"></script>
</body>
</html>
