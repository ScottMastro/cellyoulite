<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>detector debug — cellyoulite</title>
<link rel="stylesheet" href="/static/app.css" />
<style>
  body { margin:0; font-family:ui-sans-serif,system-ui,sans-serif;
         background:#111; color:#eee; }
  header { display:flex; gap:10px; align-items:center; padding:8px 12px;
           background:#1a1a1a; border-bottom:1px solid #333;
           position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header select, header button {
    background:#222; color:#eee; border:1px solid #444;
    padding:4px 8px; border-radius:4px; font-size:13px;
  }
  header button { cursor:pointer; }
  .layout { display:flex; gap:12px; }
  .panel { padding:12px; }
  .params { width:300px; flex-shrink:0; background:#161616;
            border-right:1px solid #2a2a2a; min-height:100vh; }
  .row { display:flex; align-items:center; gap:6px; margin-bottom:8px;
         font-size:12px; }
  .row label { width:110px; color:#aaa; }
  .row input[type=range] { flex:1; }
  .row .val { width:48px; text-align:right; color:#cdf; font-variant-numeric:tabular-nums; }
  .stage-toggle { display:flex; gap:4px; margin-bottom:10px; }
  .stage-toggle button.active { background:#2a4; border-color:#2a4; }
  .panes { display:flex; gap:8px; flex-wrap:wrap; }
  .img-wrap { display:inline-block; position:relative; }
  .img-wrap .caption {
    position:absolute; top:6px; left:6px;
    background:rgba(0,0,0,0.6); color:#fff;
    padding:2px 8px; border-radius:3px; font-size:11px;
    pointer-events:none;
  }
  #img, #img-before { display:block; max-width:100%; transition:opacity 0.1s; }
  .compare-off #before-wrap { display:none; }
  .compare-on .img-wrap { max-width:calc(50% - 4px); }
  .compare-on #img, .compare-on #img-before { width:100%; }
  .img-wrap.loading #img { opacity:0.5; }
  .img-wrap.loading::after {
    content:''; position:absolute; inset:0;
    border:3px solid #fd6; border-radius:4px;
    pointer-events:none;
    animation: pulse 0.6s ease-in-out infinite alternate;
  }
  @keyframes pulse { from { opacity:0.3 } to { opacity:1.0 } }
  .status { font-size:12px; color:#8c8; margin-left:auto; }
  .status.busy { color:#fd6; }
  .row.changed .val { color:#fd6; font-weight:bold; }
</style>
</head>
<body>
<header>
  <strong>debug</strong>
  <select id="well-sel"></select>
  <select id="tp-sel"></select>
  <label class="hint"><input type="checkbox" id="aligned" checked> aligned</label>
  <label class="hint"><input type="checkbox" id="compare"> compare with raw</label>
  <button id="reset">reset</button>
  <span id="status" class="status">—</span>
</header>
<div class="layout">
  <aside class="params" id="params">
    <div class="stage-toggle">
      <button data-stage="gray">gray</button>
      <button data-stage="flat" class="active">flat</button>
      <button data-stage="log">log</button>
      <button data-stage="final">final</button>
    </div>
  </aside>
  <main class="panel">
    <div class="panes compare-off" id="panes">
      <div class="img-wrap" id="before-wrap">
        <img id="img-before" src="" alt="raw" />
        <div class="caption">before · raw</div>
      </div>
      <div class="img-wrap" id="img-wrap">
        <img id="img" src="" alt="" />
        <div class="caption" id="after-caption">after</div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="/static/js/debug.js?v={{ version }}"></script>
</body>
</html>
