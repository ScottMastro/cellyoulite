<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CellxYou Lite · organoid time-series</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%2335b779' stroke-width='2'/><circle cx='16' cy='16' r='6' fill='%2335b779'/></svg>">
</head>
<body data-version="{{ version }}">

<!-- Password-less profile gate: shown until a user is chosen; pre-hidden
     server-side when a user cookie is already present. -->
<div id="user-gate" class="user-gate{% if has_user %} hidden{% endif %}">
  <div class="user-gate-card">
    <div class="user-gate-brand">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <radialGradient id="ug" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#35b779"/>
            <stop offset="100%" stop-color="#1f9e89"/>
          </radialGradient>
        </defs>
        <circle cx="16" cy="16" r="13" fill="none" stroke="#35b779" stroke-width="1.5" stroke-dasharray="3 2"/>
        <circle cx="16" cy="16" r="8" fill="url(#ug)"/>
      </svg>
      <h1>Cell<em>x</em>You Lite</h1>
    </div>
    <p class="user-gate-sub">Who's working today?</p>
    <div id="user-list" class="user-list"></div>
    <div id="user-new" class="user-new" hidden>
      <input id="user-new-name" type="text" maxlength="40" placeholder="new username" autocomplete="off" spellcheck="false">
      <div class="user-new-actions">
        <button id="user-new-create" class="primary">Create &amp; enter</button>
        <button id="user-new-cancel" class="ghost">Cancel</button>
      </div>
      <span id="user-new-err" class="hint"></span>
    </div>
  </div>
</div>

<header class="app-header">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
      <defs>
        <radialGradient id="g" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#35b779"/>
          <stop offset="100%" stop-color="#1f9e89"/>
        </radialGradient>
      </defs>
      <circle cx="16" cy="16" r="13" fill="none" stroke="#35b779" stroke-width="1.5" stroke-dasharray="3 2"/>
      <circle cx="16" cy="16" r="8" fill="url(#g)"/>
    </svg>
    <div class="name" id="brand-name">Cell<em>x</em>You Lite<span class="tag" id="brand-tag">organoid · v{{ version }}</span></div>
  </div>
  <div class="spacer"></div>
  <div class="userchip" id="userchip" hidden>
    <span class="userchip-avatar" id="userchip-avatar"></span>
    <span class="userchip-name" id="userchip-name"></span>
    <button class="ghost userchip-switch" id="user-switch" title="Switch user">Switch</button>
  </div>
  <div class="version" id="status"><span class="dot ok"></span>ready</div>
</header>

<!-- Subset image-download picker (experiments grouped by treatment). -->
<div id="dl-modal" class="dl-modal hidden">
  <div class="dl-card">
    <div class="dl-head">
      <h3>Download images</h3>
      <button id="dl-close" class="ghost">✕</button>
    </div>
    <div class="dl-controls">
      <label class="dl-all"><input type="checkbox" id="dl-select-all"> Select all</label>
      <span id="dl-count" class="hint"></span>
    </div>
    <div id="dl-list" class="dl-list"></div>
    <div class="dl-actions">
      <button id="dl-go" class="primary">Download selected</button>
    </div>
  </div>
</div>

<main>

  <section class="card">
    <h2>Data</h2>
    <div class="data-actions">
      <label class="filebtn primary" title="upload raw images (pick the folder of experiments)">
        Add image data
        <input type="file" id="add-images" webkitdirectory directory multiple hidden>
      </label>
      <label class="filebtn" title="upload an analysis results bundle (.tar.gz)">
        Add segmentation data
        <input type="file" id="add-seg" accept=".gz,.tgz,.tar.gz" hidden>
      </label>
      <button id="download-images" class="filebtn" title="download raw images for chosen experiments">Download images…</button>
      <span id="data-status" class="hint"></span>
    </div>
    <div class="pills" id="grid-pills" hidden></div>
  </section>

  <div class="tabwrap">
    <nav class="app-tabs">
      <button class="app-tab active" data-panel="panel-curate">Curate</button>
      <button class="app-tab" data-panel="panel-results">Results</button>
    </nav>
    <div class="tab-panel" id="panel-curate">

  <section class="card workspace" id="grid-card" hidden>
    <div class="chooser">
      <div id="thumb-grid"></div>
    </div>

    <div class="viewer-pane" id="well-card" hidden>
      <div class="viewer">
        <div class="viewer-toolbar">
          <span id="well-frame-label" class="viewer-title">—</span>
          <div class="spacer"></div>
          <label class="toggle"><input type="checkbox" id="toggle-align" checked>
            <span class="swatch swatch-align"></span> align frames</label>
          <label class="toggle"><input type="checkbox" id="toggle-edges" checked>
            <span class="swatch swatch-edges"></span> pixel edges</label>
          <label class="toggle"><input type="checkbox" id="toggle-cellpose">
            <span class="swatch swatch-cellpose"></span> circles</label>
          <label class="toggle"><input type="checkbox" id="toggle-ids" checked>
            <span class="swatch swatch-ids">#</span> ids</label>
          <label class="toggle"><input type="checkbox" id="toggle-deactivated">
            <span class="swatch swatch-invalid"></span> deactivated</label>
          <button id="viewer-fs" class="ghost" title="fullscreen">⛶</button>
          <button id="well-close" class="ghost">close</button>
        </div>

        <div class="viewer-canvas">
          <div class="image-stack">
            <img id="viewer-img" class="base" alt="">
            <img id="layer-edges-img" class="overlay" alt="">
            <svg id="viewer-svg" class="overlay" preserveAspectRatio="none">
              <g id="layer-cellpose"></g>
              <g id="layer-cellpose-labels"></g>
            </svg>
          </div>
        </div>

        <div class="playbar">
          <button id="play-btn" class="primary play-btn" title="play/pause">▶</button>
          <input id="scrub" type="range" min="0" max="0" value="0" step="1">
          <span id="scrub-label" class="mono small">0 / 0</span>
          <label class="speed">speed
            <select id="speed">
              <option value="2000">0.125×</option>
              <option value="1000">0.25×</option>
              <option value="500" selected>0.5×</option>
              <option value="250">1×</option>
              <option value="125">2×</option>
              <option value="60">4×</option>
            </select>
          </label>
        </div>

        <div class="filmstrip-wrap">
          <div id="filmstrip" class="filmstrip"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="card" id="tracks-card" hidden>
    <div id="all-tracks" class="all-tracks" hidden>
      <div class="all-tracks-head">
        <span class="job-bar-label">organoids in this well</span>
        <span id="all-tracks-count" class="hint">—</span>
        <label class="toggle"><input type="checkbox" id="atr-annotated" checked>
          <span class="swatch swatch-cellpose"></span> show annotated</label>
      </div>
      <div id="all-tracks-list" class="all-tracks-list"></div>
      <div class="all-tracks-foot">
        <button id="validate-well" class="primary">Validate well</button>
        <span id="validate-status" class="hint"></span>
      </div>
    </div>

    <div id="track-stitch" class="track-stitch" hidden>
      <div class="track-stitch-head">
        <span id="track-stitch-title">organoid</span>
        <button id="track-stitch-close" class="ghost">×</button>
      </div>
      <div class="track-stitch-scroll">
        <img id="track-stitch-img" alt="organoid over time">
      </div>
    </div>

    <div id="growth-box" class="growth-box" hidden>
      <div id="growth-controls" class="growth-controls">
        <label class="toggle"><input type="checkbox" id="growth-autoscale"> auto-scale Y</label>
        <label class="toggle"><input type="checkbox" id="growth-stars-only"> ★ stars only</label>
        <label class="toggle"><input type="checkbox" id="growth-show-rejected"> show rejected (dotted)</label>
      </div>
      <div id="growth-plot" class="growth-plot"></div>
    </div>
  </section>
    </div><!-- /panel-curate -->

    <div class="tab-panel" id="panel-results" hidden>
  <section class="card" id="boxplot-card" hidden>
    <h2>Growth distributions</h2>
    <div class="box-bar">
      <button id="box-back" class="ghost" hidden>← All conditions</button>
      <label class="toggle"><input type="checkbox" id="box-stars-only"> ★ stars only</label>
      <label class="toggle"><input type="checkbox" id="box-by-rep"> separate replicates</label>
      <label class="toggle">scale
        <select id="box-scale" class="inline-select">
          <option value="fold" selected>fold (×)</option>
          <option value="pct">% change</option>
          <option value="log2">log₂</option>
        </select>
      </label>
      <span id="box-summary" class="box-summary"></span>
      <button id="box-csv" class="ghost" title="download R-friendly long-format CSV">CSV ↓</button>
    </div>
    <div id="boxplot"></div>
  </section>
    </div><!-- /panel-results -->
  </div><!-- /tabwrap -->

</main>

<footer>CellxYou Lite · <span id="ver-mono">v{{ version }}</span></footer>

<script type="module" src="/static/js/main.js?v={{ version }}"></script>
</body>
</html>
